services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expenses
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d expenses"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://app:app@db:5432/expenses?sslmode=disable
      HTTP_ADDR: ":8080"
      TZ: ${TZ:-UTC}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  bot:
    build: ./bot
    environment:
      BACKEND_URL: http://backend:8080
      TZ: ${TZ:-UTC}
      # Секреты берутся из .env (или из переменных окружения shell). В образ они не попадают.
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?Укажите TELEGRAM_TOKEN в .env}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Не секреты: значения по умолчанию, переопределяются в .env
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS:-}
    depends_on:
      backend:
        condition: service_healthy
    # У бота нет HTTP-порта: он обновляет /tmp/healthy после каждого успешного опроса Telegram
    # (long polling возвращается не реже раза в 30 с). Файл старше 90 с = бот завис или нет связи с Telegram.
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/healthy) )) -lt 90"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata: